name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Self-check the eval pipeline (offline mock provider)
        run: |
          gar run --suite suites/smoke.json --provider mock \
                  --report reports/smoke.md --json reports/smoke.json \
                  --fail-on-gate --quiet
      - name: Upload report card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gar-report-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
