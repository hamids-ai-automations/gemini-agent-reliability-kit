[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-agent-reliability-kit"
version = "0.1.0"
description = "Measure tool-calling, structured-output, retry, latency and cost reliability of Gemini agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hamid" }]
keywords = ["gemini", "agents", "evals", "reliability", "tool-calling", "google-cloud"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
gar = "gar.cli:main"

[tool.setuptools.packages.find]
include = ["gar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
